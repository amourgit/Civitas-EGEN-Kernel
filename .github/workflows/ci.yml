name: EGEN Kernel CI

on:
  push:
    branches: [ main, architecture/blueprint-v4 ]
  pull_request:
    branches: [ main, architecture/blueprint-v4 ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (reactor complet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tester le SDK Python (stdlib seule, contrat de resilience partage)
        run: |
          cd sdk/python
          python3 -m unittest discover -s tests -t . -v

      - name: Construire et tester tout le reacteur Maven
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee /tmp/maven-build.log

      - name: Publier le resume du build en commentaire de commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re

          outcome = os.environ["OUTCOME"]
          run_url = os.environ["RUN_URL"]

          with open('/tmp/maven-build.log', 'r', errors='replace') as f:
              content = f.read()

          if outcome == "failure":
              tail = content[-55000:]
              body = (
                  "### Diagnostic automatique - echec du build Maven\n\n"
                  f"Run : {run_url}\n\n"
                  "```\n" + tail + "\n```"
              )
          else:
              lines = [
                  l for l in content.splitlines()
                  if "Tests run:" in l or l.strip().startswith("[INFO] Building ")
                  or "BUILD SUCCESS" in l
              ]
              summary = "\n".join(lines) if lines else "(aucune ligne de synthese trouvee)"
              body = (
                  "### Resume automatique - build reussi\n\n"
                  f"Run : {run_url}\n\n"
                  "```\n" + summary + "\n```"
              )

          with open('/tmp/payload.json', 'w') as f:
              json.dump({"body": body}, f)
          PYEOF
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/commits/${SHA}/comments" \
            -d @/tmp/payload.json

      - name: Publier les rapports de test en cas d'echec
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore

      - name: Faire echouer le job si le build a echoue
        if: steps.build.outcome == 'failure'
        run: exit 1

  e2e:
    # Test de niveau 5 (docs/architecture/17, « Niveau 5 » ; 20 — Scenario de bout en bout) : le scenario du
    # doc 20 rejoue contre le VRAI Kernel et un environnement ephemere complet (PostgreSQL, NATS, Consul, Vault
    # et un Nomad client qui execute de vraies allocations, via Testcontainers). Job separe : il exige Docker et
    # plusieurs minutes, et ne doit jamais ralentir le retour du build principal.
    name: Acceptation de bout en bout (niveau 5)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Installer Nomad et demarrer un agent CLIENT sur l'hote (driver docker)
        # HashiCorp ne supporte pas un client Nomad dans un conteneur : l'agent est un processus de l'hote.
        run: |
          curl -fsSL -o /tmp/nomad.zip https://releases.hashicorp.com/nomad/1.8.4/nomad_1.8.4_linux_amd64.zip
          unzip -q /tmp/nomad.zip -d /tmp
          sudo mv /tmp/nomad /usr/local/bin/nomad
          nomad version
          # En mode -dev Nomad annonce le loopback : Consul (dans un conteneur) ne pourrait pas joindre les services.
          IFACE=$(ip route show default | awk '/default/ {print $5; exit}')
          echo "Interface reseau annoncee par Nomad : ${IFACE}"
          sudo nohup nomad agent -dev -bind=0.0.0.0 -network-interface="${IFACE}" > /tmp/nomad.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4646/v1/status/leader >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:4646/v1/status/leader

      - name: Installer les modules sans tests (le job build-and-test les execute)
        run: mvn -B -ntp install -DskipTests -DskipITs

      - name: Rejouer le scenario du doc 20 contre l'environnement ephemere complet
        id: scenario
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B -ntp -pl egen-bootstrap -Pe2e verify 2>&1 | tee /tmp/e2e.log

      - name: Journal de l'agent Nomad
        if: always()
        run: tail -n 60 /tmp/nomad.log || true

      - name: Publier le diagnostic du niveau 5 en commentaire de commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.scenario.outcome }}
        run: |
          python3 .github/scripts/e2e-diagnostic.py
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/commits/${SHA}/comments" \
            -d @/tmp/payload-e2e.json

      - name: Conserver les rapports en cas d'echec
        if: steps.scenario.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-surefire-reports
          path: egen-bootstrap/target/surefire-reports

      - name: Faire echouer le job si le scenario a echoue
        if: steps.scenario.outcome == 'failure'
        run: exit 1
