# EGEN Kernel — configuration par defaut (Phase 1).
# Voir docs/architecture/16-packages-et-stack-technique.md pour le detail des
# choix technologiques, et docs/architecture/19-feuille-de-route.md pour ce
# que chaque phase ajoute a cette configuration.

quarkus.application.name=egen-kernel

# Environnement cible par defaut applique a un Declare qui n'en precise pas
# (voir docs/architecture/13-api-et-contrats.md, "POST /api/v1/services").
egen.environment=development

# Adresse de l'API HTTP Nomad. ${NOMAD_ADDR:...} reprend la convention
# d'environnement du CLI Nomad officiel, pour que ce Kernel s'integre
# naturellement dans un environnement ou NOMAD_ADDR est deja exporte.
egen.nomad.address=${NOMAD_ADDR:http://localhost:4646}

# Token ACL Nomad de l'adapter — scope minimal (submit-job, read-job,
# dispatch-job), jamais le token root de bootstrap (voir
# docs/architecture/14-securite.md). Absent par defaut (cluster Nomad dev
# sans ACL) ; a fournir en production via la variable d'environnement.
%prod.egen.nomad.token=${NOMAD_TOKEN:}
