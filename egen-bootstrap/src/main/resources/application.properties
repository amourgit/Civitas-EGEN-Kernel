# EGEN Kernel — configuration par defaut (Phase 1).
# Voir docs/architecture/16-packages-et-stack-technique.md pour le detail des
# choix technologiques, et docs/architecture/19-feuille-de-route.md pour ce
# que chaque phase ajoute a cette configuration.

quarkus.application.name=egen-kernel

# Environnement cible par defaut applique a un Declare qui n'en precise pas
# (voir docs/architecture/13-api-et-contrats.md, "POST /api/v1/services").
egen.environment=development

# Adresse de l'API HTTP Nomad. ${NOMAD_ADDR:...} reprend la convention
# d'environnement du CLI Nomad officiel, pour que ce Kernel s'integre
# naturellement dans un environnement ou NOMAD_ADDR est deja exporte.
egen.nomad.address=${NOMAD_ADDR:http://localhost:4646}

# Token ACL Nomad de l'adapter — scope minimal (submit-job, read-job,
# dispatch-job), jamais le token root de bootstrap (voir
# docs/architecture/14-securite.md). Absent par defaut (cluster Nomad dev
# sans ACL) ; a fournir en production via la variable d'environnement.
%prod.egen.nomad.token=${NOMAD_TOKEN:}

# Adresse de l'API HTTP Consul. ${CONSUL_HTTP_ADDR:...} reprend la
# convention d'environnement du CLI Consul officiel.
egen.consul.address=${CONSUL_HTTP_ADDR:http://localhost:8500}

# Token ACL Consul de l'adapter — write scoped aux prefixes de service geres
# par EGEN, jamais un token root (voir docs/architecture/14-securite.md).
%prod.egen.consul.token=${CONSUL_HTTP_TOKEN:}

# Registry EGEN (PostgreSQL, voir docs/architecture/08-registry.md) — pool
# gere par l'extension Quarkus Agroal, injecte dans
# egen-adapter-postgres-registry via RegistryAdapterBeans. Le module adapter
# lui-meme ne depend d'aucune extension Quarkus (garde-fou n6).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${EGEN_REGISTRY_DB_URL:jdbc:postgresql://localhost:5432/egen_registry}
quarkus.datasource.username=${EGEN_REGISTRY_DB_USER:egen}
quarkus.datasource.password=${EGEN_REGISTRY_DB_PASSWORD:egen}

# Messaging (NATS JetStream, voir docs/architecture/07-ports-et-adapters.md,
# "Kafka vs NATS JetStream" — NATS retenu par defaut en V1).
egen.nats.url=${NATS_URL:nats://localhost:4222}

# Secrets (HashiCorp Vault, voir docs/architecture/07-ports-et-adapters.md,
# "Secrets Port"). Le token racine de dev n'est jamais utilise en
# production (voir docs/architecture/14-securite.md).
egen.vault.address=${VAULT_ADDR:http://localhost:8200}
%prod.egen.vault.token=${VAULT_TOKEN:}
%dev.egen.vault.token=${VAULT_TOKEN:egen-dev-root-token}

# Observabilite (OpenTelemetry, export OTLP gRPC vers un Collector — voir
# docs/architecture/15-observabilite.md).
egen.otel.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
egen.otel.service-namespace=${EGEN_OTEL_NAMESPACE:egen}
# deployment.environment (OTel) distinct de egen.environment ci-dessus, qui
# est l'environnement CIBLE d'un service DEPLOYE, pas celui d'execution du
# Kernel lui-meme (voir OtelObservabilityAdapter, javadoc du constructeur).
%prod.egen.deployment-environment=production
%dev.egen.deployment-environment=development
%test.egen.deployment-environment=test

# Authentification et RBAC de l'API de controle (Phase 4, voir
# docs/architecture/14-securite.md). Un jeton JWT MicroProfile JWT (emis
# par n'importe quel IdP OIDC d'entreprise, ex. Keycloak) est verifie ici
# — quarkus-smallrye-jwt seul suffit a la fois pour la validation et pour
# l'acces type aux claims (voir egen-api/pom.xml). Issuer/JWKS absents par
# defaut : EGEN reste demarrable sans IdP configure (garde-fou n4,
# docs/architecture/02-principes-fondamentaux.md, "Kernel vide") — sans
# jeton valide, tout appel mutant est refuse par la politique HTTP
# ci-dessous, ce qui est un etat sur, jamais un etat casse.
%prod.mp.jwt.verify.issuer=${EGEN_OIDC_ISSUER_URL:}
%prod.mp.jwt.verify.publickey.location=${EGEN_OIDC_JWKS_URL:}
# Nom du claim JWT portant l'equipe proprietaire (voir
# docs/architecture/06-service-manifest.md, "team: content-platform") et
# du role Kernel autorisant a agir sur n'importe quelle equipe — voir
# EgenSecurityContext. Configurables : aucun nom de claim ni de role n'est
# impose par un IdP particulier.
egen.security.team-claim=team
egen.security.admin-role=egen-admin

# Politique HTTP par defaut : tout est refuse sauf /api/v1/health (voir
# docs/architecture/14-securite.md, "zero confiance implicite, meme en
# interne") — independante du fait qu'une ressource porte ou non
# @Authenticated : un futur endpoint qui oublierait l'annotation reste
# protege par cette politique de chemin (defense en profondeur).
quarkus.http.auth.permission.health.paths=/api/v1/health
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.controlled.paths=/api/v1/*
quarkus.http.auth.permission.controlled.policy=authenticated

# mTLS machine-a-machine (voir docs/architecture/14-securite.md et
# docs/architecture/21-systeme-agents-et-gateway.md, §21.1 — la
# terminaison TLS publique elle-meme est faite par l'Edge Gateway, en
# amont de ce Kernel, pas ici) : desactive par defaut (aucun certificat de
# developpement fourni). A activer en configurant un key-store/trust-store
# et en decommentant les deux lignes suivantes.
#quarkus.http.ssl.client-auth=REQUEST
#quarkus.http.insecure-requests=disabled
