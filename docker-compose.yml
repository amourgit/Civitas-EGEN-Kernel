# Environnement local pour EGEN Kernel — perimetre Phase 1 uniquement (voir
# docs/architecture/19-feuille-de-route.md). Consul, NATS JetStream, Vault et
# PostgreSQL rejoignent ce fichier aux phases qui les introduisent
# (respectivement Phase 2, Phase 3, Phase 4, Phase 2), jamais par
# anticipation.
services:

  # Nomad — le Deployment Adapter y delegue tout (scheduling, allocation,
  # rolling update natif). Mode dev : ACL desactivees, un seul noeud
  # serveur+client, adapte au developpement local uniquement — jamais a la
  # production. Voir docs/architecture/07-ports-et-adapters.md, "Deployment
  # Port + Nomad Adapter".
  nomad:
    image: hashicorp/nomad:1.8
    container_name: egen-nomad
    restart: unless-stopped
    command: ["agent", "-dev", "-bind=0.0.0.0", "-log-level=INFO"]
    cap_add:
      - IPC_LOCK
    ports:
      - "4646:4646"   # API HTTP + UI (http://localhost:4646)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4646/v1/status/leader"]
      interval: 5s
      timeout: 5s
      retries: 10
