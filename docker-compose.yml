# Environnement local pour EGEN Kernel — perimetre Phase 1-4 (voir
# docs/architecture/19-feuille-de-route.md).
services:

  # Nomad — le Deployment Adapter y delegue tout (scheduling, allocation,
  # rolling update natif). Mode dev : ACL desactivees, un seul noeud
  # serveur+client, adapte au developpement local uniquement. Voir
  # docs/architecture/07-ports-et-adapters.md, "Deployment Port + Nomad
  # Adapter".
  nomad:
    image: hashicorp/nomad:1.8
    container_name: egen-nomad
    restart: unless-stopped
    command: ["agent", "-dev", "-bind=0.0.0.0", "-log-level=INFO"]
    cap_add:
      - IPC_LOCK
    ports:
      - "4646:4646"   # API HTTP + UI (http://localhost:4646)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4646/v1/status/leader"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Consul — le Discovery Adapter y delegue l'enregistrement et la
  # resolution d'instances saines. Mode dev : ACL desactivees, adapte au
  # developpement local uniquement. Voir
  # docs/architecture/07-ports-et-adapters.md, "Discovery Port + Consul
  # Adapter".
  consul:
    image: hashicorp/consul:1.19
    container_name: egen-consul
    restart: unless-stopped
    command: ["agent", "-dev", "-client=0.0.0.0"]
    ports:
      - "8500:8500"   # API HTTP + UI (http://localhost:8500)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8500/v1/status/leader"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PostgreSQL — persistance du Registry EGEN (DesiredState + ServiceStatus,
  # verrouillage optimiste sur "generation"). Voir
  # docs/architecture/08-registry.md.
  postgres:
    image: postgres:16-alpine
    container_name: egen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: egen_registry
      POSTGRES_USER: egen
      POSTGRES_PASSWORD: egen
    ports:
      - "5432:5432"
    volumes:
      - egen_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egen -d egen_registry"]
      interval: 5s
      timeout: 5s
      retries: 10

  # NATS JetStream — implementation par defaut du Messaging Adapter (voir
  # docs/architecture/07-ports-et-adapters.md, "Kafka vs NATS JetStream").
  # "-js" active JetStream (persistance/replay), necessaire au-dela du
  # pub/sub ephemere de coeur NATS.
  nats:
    image: nats:2.10-alpine
    container_name: egen-nats
    restart: unless-stopped
    command: ["-js"]
    ports:
      - "4222:4222"   # protocole client NATS
      - "8222:8222"   # monitoring HTTP (http://localhost:8222)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Vault — le Secrets Adapter n'y verifie jamais que l'EXISTENCE d'une
  # reference, jamais la valeur (voir docs/architecture/07-ports-et-adapters.md,
  # "Secrets Port"). Mode dev uniquement : token racine fixe, stockage en
  # memoire — jamais en production (voir docs/architecture/14-securite.md).
  vault:
    image: hashicorp/vault:1.13
    container_name: egen-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: egen-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"   # API HTTP + UI (http://localhost:8200)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8200/v1/sys/health?standbyok=true"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Collecteur OpenTelemetry — recoit les traces/metriques OTLP du Kernel et
  # les route vers Jaeger (traces) et Prometheus (metriques). Voir
  # deploy/otel-collector-config.yaml et
  # docs/architecture/16-packages-et-stack-technique.md.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: egen-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC — c'est l'endpoint que le Kernel utilise
    depends_on:
      - jaeger

  # Jaeger — visualisation des traces (voir
  # docs/architecture/20-scenario-bout-en-bout.md : "une trace unique...
  # montre le chemin complet d'un deploiement").
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: egen-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI (http://localhost:16686)

  # Prometheus — visualisation des metriques exportees par le Kernel via
  # le collecteur OpenTelemetry.
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: egen-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"   # UI (http://localhost:9090)
    depends_on:
      - otel-collector

volumes:
  egen_postgres_data:
