services:

  # PostgreSQL — la memoire souveraine, utilisee par tous les modules Kernel et
  # egen-modules avec Traçabilite (identity, authorization, module-registry,
  # organization, reference-data...). En dev/test, Quarkus Dev Services provisionne
  # deja un Postgres ephemere automatiquement — ce service sert a un demarrage
  # manuel de kernel-bootstrap (quarkus.datasource.jdbc.url pointant ici) ou a une
  # inspection persistante des donnees entre deux redemarrages.
  postgres:
    image: postgres:16
    container_name: egen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: egen
      POSTGRES_PASSWORD: egen
      POSTGRES_DB: egen
    ports:
      - "5432:5432"
    volumes:
      - egen-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egen -d egen"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka — le Bus d'Evenements, en mode KRaft (sans Zookeeper). Consomme par
  # eventbus-kafka-adapter (KafkaEventBusAdapter). Convention de topic EGEN :
  # egen.<systeme-origine> (ex. egen.organisation) — voir kernel-eventbus/pom.xml.
  kafka:
    image: bitnami/kafka:3.7
    container_name: egen-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@egen-kafka:9093"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://egen-kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:9094"    # acces depuis l'hote (bootstrap.servers=localhost:9094)
    volumes:
      - egen-kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Keycloak — Identite riche (Niveau 2), consomme par identity-provider-keycloak.
  # Realm/clients a importer manuellement ou via un fichier de realm monte a part
  # (hors scope de ce compose minimal).
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: egen-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/egen_keycloak
      KC_DB_USERNAME: egen
      KC_DB_PASSWORD: egen
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # SpiceDB — Autorisation riche (Niveau 2), consomme par le futur
  # authorization-provider-spicedb (pas encore construit). Preset avec une cle de
  # test uniquement pour le developpement local — jamais en production.
  spicedb:
    image: authzed/spicedb:latest
    container_name: egen-spicedb
    restart: unless-stopped
    command: serve --grpc-preshared-key "egen-dev-key" --datastore-engine memory
    ports:
      - "50051:50051"   # gRPC
      - "8443:8443"     # dashboard HTTP

  # Valkey — cache (Redis-compatible, Apache 2.0, remplace Redis/AGPLv3). Aucun
  # module ne l'utilise encore reellement dans ce depot ; provisionne par avance
  # puisqu'il fait partie de la pile actee (kernel-jpa-support/anatomie du Kernel).
  valkey:
    image: valkey/valkey:8
    container_name: egen-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - egen-valkey-data:/data

volumes:
  egen-postgres-data:
  egen-kafka-data:
  egen-valkey-data:
