# EGEN Kernel — configuration de production (la racine de composition).
#
# Aucune quarkus.datasource.jdbc.url n'est fixee ici : en dev et en test, Quarkus Dev
# Services provisionne automatiquement un conteneur PostgreSQL ephemere (necessite
# Docker). En production, ces valeurs proviennent des variables d'environnement
# (QUARKUS_DATASOURCE_JDBC_URL, _USERNAME, _PASSWORD), qui prennent le pas sur ce
# fichier — voir docker-compose.yml a la racine du depot pour un exemple local.
quarkus.application.name=egen-kernel

quarkus.datasource.db-kind=postgresql

quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# Une seule execution Flyway de production, combinant les trois sequences
# renumerotees pour rester mutuellement uniques dans cet ensemble (voir le pom.xml
# de ce module et la note de convention dans V1__init_identity.sql) : V1 identity,
# V2 authorization, V3 module-registry. Table d'historique dediee a cette
# composition — jamais celle d'un module pris isolement.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration/identity,classpath:db/migration/authorization,classpath:db/migration/moduleregistry
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.table=flyway_schema_history_kernel

# Repertoire scrute au demarrage pour les modules candidats au chargement (voir
# PluginDirectoryScanner) — convention : une paire <moduleId>.jar +
# <moduleId>.properties par module, directement dans ce repertoire.
egen.kernel.plugins-directory=plugins

# Obligatoire, sans valeur par defaut (voir KernelBootConfig) : le Contexte racine
# utilise pour la toute premiere passe de chargement au demarrage — une valeur
# inventee silencieusement serait pire qu'un echec de demarrage franc et explicite.
# A fournir via variable d'environnement (EGEN_KERNEL_CONTEXTE_RACINE) en production ;
# exemple local dans .env.example a la racine du depot. Valeurs fixes ci-dessous pour
# les profils dev et test uniquement — jamais pour le profil de production (prod),
# qui doit echouer au demarrage si cette valeur n'est pas fournie explicitement.
%dev.egen.kernel.contexte-racine=00000000-0000-0000-0000-000000000001
%test.egen.kernel.contexte-racine=00000000-0000-0000-0000-000000000001
