  schema: controlplane-descriptor.schema.json
  valid: false
  keyword: pattern
  path: id
  note: id qui n'est pas une identité SPIFFE EGEN
- file: invalid/descriptor--sans-c1.json
  schema: controlplane-descriptor.schema.json
  valid: false
  keyword: required
  path: contracts
  note: C1 doit toujours être déclaré
- file: invalid/descriptor--contrat-inconnu.json
  schema: controlplane-descriptor.schema.json
  valid: false
  keyword: pattern
  path: contracts
  note: contrat C9 inexistant
- file: invalid/capability--nom-majuscules.json
  schema: capability.schema.json
  valid: false
  keyword: pattern
  path: name
  note: nom de capacité non kebab-case
- file: invalid/capability--sans-idempotent.json
  schema: capability.schema.json
  valid: false
  keyword: required
  path: operations/0
  note: idempotent obligatoire
- file: invalid/operation-request--scope-joker.json
  schema: operation-request.schema.json
  valid: false
  keyword: pattern
  path: scope
  note: joker interdit dans une demande
- file: invalid/operation--id-non-ulid.json
  schema: operation.schema.json
  valid: false
  keyword: pattern
  path: id
  note: identifiant d'opération non ULID
