  valid: false
  keyword: minItems
  path: status/conditions
  note: au moins une condition
- file: invalid/cloudevent--specversion-1.0.2.json
  schema: cloudevent.schema.json
  valid: false
  keyword: const
  path: specversion
  note: specversion doit valoir 1.0
- file: invalid/cloudevent--type-sans-version.json
  schema: cloudevent.schema.json
  valid: false
  keyword: pattern
  path: type
  note: type d'événement sans suffixe de version
- file: invalid/cloudevent--heure-locale.json
  schema: cloudevent.schema.json
  valid: false
  keyword: pattern
  path: time
