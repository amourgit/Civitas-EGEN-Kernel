# Vault hors mode développement, en conteneur (docs/architecture/19, phase P0, étape P0-4).
# Lancer : docker compose -f deploy/vault/docker-compose.yml up -d
# Puis    : bash deploy/vault/vault-bootstrap.sh
services:
  vault:
    image: hashicorp/vault:1.13
    container_name: egen-vault-prod
    restart: unless-stopped
    command: ["vault", "server", "-config=/vault/config/vault-server.hcl"]
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - ./vault-server.hcl:/vault/config/vault-server.hcl:ro
      - vault-data:/vault/file
volumes:
  vault-data:
