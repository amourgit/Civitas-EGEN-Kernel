# Collecteur OpenTelemetry pour l'environnement local EGEN Kernel — voir
# docs/architecture/16-packages-et-stack-technique.md ("OpenTelemetry SDK +
# Collector") et docs/architecture/15-observabilite.md. Recoit les traces et
# metriques OTLP du Kernel, route les traces vers Jaeger et expose les
# metriques au format Prometheus.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
